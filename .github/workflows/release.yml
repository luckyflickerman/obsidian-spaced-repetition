name: Release

# Pushing a tag equal to the version in manifest.json (e.g. 0.9.0, 1.0.0 - without "v")
# builds the plugin and publishes a GitHub release that BRAT and Obsidian can install.
on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"
            - "[0-9]+.[0-9]+.[0-9]+-*"

env:
    PLUGIN_ID: upgraded-spaced-repetition

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7

            - name: Check that the tag matches manifest.json
              run: |
                  tag="${GITHUB_REF_NAME}"
                  version="$(node -p "require('./manifest.json').version")"
                  echo "Tag: ${tag}, manifest.json version: ${version}"
                  if [ "${tag}" != "${version}" ]; then
                      echo "::error::Tag ${tag} is not equal to the version in manifest.json (${version}). Change one of them so they are the same."
                      exit 1
                  fi
                  if ! node -e "process.exit(require('./versions.json')['${version}'] ? 0 : 1)"; then
                      echo "::warning::versions.json has no entry for ${version}."
                  fi

            # Uses the pnpm version from "packageManager" in package.json
            - uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

            - name: Check the release files
              run: ls -la build/main.js manifest.json styles.css

            - name: Package zip
              run: |
                  mkdir "${PLUGIN_ID}"
                  cp build/main.js manifest.json styles.css "${PLUGIN_ID}/"
                  zip -r "${PLUGIN_ID}-${GITHUB_REF_NAME}.zip" "${PLUGIN_ID}"

            - name: Release notes from CHANGELOG-UPGRADED.md
              run: |
                  # Lines below "## <version>" up to the next "## " heading
                  awk -v v="${GITHUB_REF_NAME}" '
                      $0 ~ "^## \\[?" v "\\]?([^0-9.-]|$)" { found = 1; next }
                      found && /^## / { exit }
                      found { print }
                  ' CHANGELOG-UPGRADED.md > release-notes.md
                  if [ ! -s release-notes.md ]; then
                      echo "Release ${GITHUB_REF_NAME}" > release-notes.md
                      echo "::warning::No section for ${GITHUB_REF_NAME} in CHANGELOG-UPGRADED.md."
                  fi
                  cat release-notes.md

            - name: Publish the release
              uses: softprops/action-gh-release@v2
              with:
                  name: ${{ github.ref_name }}
                  body_path: release-notes.md
                  # Only "x.y.z-something" is a pre-release; plain versions must be "latest",
                  # because the update check in the status bar reads /releases/latest
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  files: |
                      build/main.js
                      manifest.json
                      styles.css
                      ${{ env.PLUGIN_ID }}-${{ github.ref_name }}.zip
