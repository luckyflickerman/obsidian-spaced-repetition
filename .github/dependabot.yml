# Limited on purpose: once a month, everything in one grouped pull request per ecosystem,
# no major versions. (Python/mkdocs docs are not published from this fork.)
version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 1
      groups:
          npm:
              patterns:
                  - "*"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 1
      groups:
          github-actions:
              patterns:
                  - "*"
